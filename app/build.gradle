plugins { id 'com.android.application' }
android {
    namespace 'com.aetherbolt.browser'
    compileSdk { version = release(37) { minorApiLevel = 2 } }
    defaultConfig {
        applicationId 'com.aetherbolt.gecko'
        minSdk 26
        ndk {
            def selectedAbi = providers.gradleProperty('aetherAbi').orNull
            if (selectedAbi != null) {
                if (!(selectedAbi in ['arm64-v8a', 'armeabi-v7a'])) throw new GradleException('Unsupported ABI')
                abiFilters selectedAbi
            } else {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
        targetSdk 35
        versionCode 40
        versionName '0.9.2-devsuite-alpha'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'info.guardianproject:tor-android:0.4.9.17'
    implementation 'org.videolan.android:libvlc-all:3.7.5'
    implementation 'org.mozilla.geckoview:geckoview:161.0.20261118180411'
    implementation 'androidx.core:core:1.19.1'
    implementation 'com.wireguard.android:tunnel:1.0.20260102'
}

// Local developer tools are packaged into the APK, never fetched from webpages at runtime.
tasks.register('prepareDevSuite', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'tools/prepare_devsuite.py'
}
tasks.named('preBuild').configure { dependsOn tasks.named('prepareDevSuite') }

// The approved art pack contains only Android drawable resources.
def brandingArchive = rootProject.file('aetherbolt-branding.zip')
def brandingRes = layout.buildDirectory.dir('generated/aetherBranding/res')
android.sourceSets.main.res.srcDir(brandingRes.get().asFile)
tasks.register('prepareAetherBranding', Sync) {
    from({ zipTree(brandingArchive) }) {
        include 'drawable-nodpi/aether_icon.png', 'drawable-nodpi/aether_adaptive_fg.png', 'drawable-nodpi/aether_monster.jpg'
    }
    into brandingRes
    doFirst {
        if (!brandingArchive.isFile()) throw new GradleException('Upload aetherbolt-branding.zip to the repository root before building.')
    }
}
tasks.named('preBuild').configure { dependsOn tasks.named('prepareAetherBranding') }
