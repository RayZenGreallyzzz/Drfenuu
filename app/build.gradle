plugins { id 'com.android.application' }
android {
    namespace 'com.aetherbolt.browser'
    compileSdk { version = release(37) { minorApiLevel = 2 } }
    defaultConfig {
        applicationId 'com.aetherbolt.gecko'
        minSdk 26
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        targetSdk 35
        versionCode 9
        versionName '0.6.1-gecko-alpha'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'org.mozilla.geckoview:geckoview:161.0.20261118180411' }
