<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AetherBolt Linux v86</title><link rel="stylesheet" href="xterm.css"><link rel="stylesheet" href="style.css"><body><h2>Linux / v86</h2><p>Виртуальный x86-компьютер без доступа к системе Android. 128 МБ RAM. Данные гостя временные.</p><label>Свой ISO (необязательно) <input id="iso" type="file" accept=".iso"></label><div><button id="start">Запустить Linux</button><button id="stop">Остановить</button><button id="kbd">Клавиатура</button><button id="enter">Enter</button><button id="esc">Esc</button><button id="backspace">Backspace</button></div><p id="status" role="status">Готов к запуску</p><div id="screen"><div class="vga"></div><canvas style="display:none"></canvas></div><div id="terminal"></div><label>Ввод <select id="mode"><option value="vga">Экран VGA</option><option value="serial">Serial</option></select></label><form id="send"><input id="command" placeholder="Команда для Linux" autocomplete="off" autocapitalize="off"><button type="submit">Отправить</button></form><script src="libv86.js"></script><script src="xterm.js"></script><script src="vm.js"></script></body></html>
