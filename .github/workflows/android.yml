name: Build signed AetherBolt DevSuite
on:
  workflow_dispatch:
  push:
    branches: [devsuite-edition]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SIGNING_READY: ${{ secrets.DEV_KEYSTORE_B64 != '' && secrets.DEV_KEYSTORE_PASSWORD != '' }}
    steps:
      - name: Require dedicated DevSuite signing credentials
        shell: bash
        run: |
          if [ "$SIGNING_READY" != true ]; then echo '::error::Configure DEV_KEYSTORE_B64 and DEV_KEYSTORE_PASSWORD in repository Actions secrets. No unsigned or debug APK will be published.'; exit 1; fi
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK packages
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --list --channel=3 > /tmp/sdk-packages.txt
          grep -E "platforms;android-(37|CinnamonBun)|build-tools;37" /tmp/sdk-packages.txt || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --channel=3 "platforms;android-37.2" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - run: bash tests/run.sh
      - run: python3 -m unittest discover -s tools -p test_delta.py -v
      - name: Build unsigned ARM64 release
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if [ "$attempt" = 2 ]; then export AETHER_MAVEN_REPO=https://repo1.maven.org/maven2/; fi
            if [ "$attempt" = 3 ]; then export AETHER_MAVEN_REPO=https://maven-central.storage-download.googleapis.com/maven2/; fi
            if gradle :app:assembleRelease -PaetherAbi=arm64-v8a --stacktrace > build-attempt.log 2>&1; then cat build-attempt.log; exit 0; fi
            cat build-attempt.log
            if ! grep -Eq '429|502|503|504|Connection reset|Read timed out' build-attempt.log || [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((attempt * 8))
          done
      - name: Sign and verify ARM64 APK
        shell: bash
        env:
          DEV_KEYSTORE_B64: ${{ secrets.DEV_KEYSTORE_B64 }}
          DEV_KEYSTORE_PASSWORD: ${{ secrets.DEV_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KEY="$(mktemp "$RUNNER_TEMP/aether-key.XXXXXX")"
          trap 'rm -f "$KEY"' EXIT
          printf '%s' "$DEV_KEYSTORE_B64" | base64 --decode > "$KEY"
          unset DEV_KEYSTORE_B64
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          INPUT=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$INPUT"
          mkdir -p signed
          "$TOOLS/zipalign" -P 16 -f 4 "$INPUT" "$RUNNER_TEMP/aligned.apk"
          "$TOOLS/apksigner" sign --ks "$KEY" --ks-type PKCS12 --ks-key-alias aetherbolt-devsuite --ks-pass env:DEV_KEYSTORE_PASSWORD --key-pass env:DEV_KEYSTORE_PASSWORD --out signed/AetherBolt-DevSuite-arm64.apk "$RUNNER_TEMP/aligned.apk"
          "$TOOLS/apksigner" verify --verbose --print-certs signed/AetherBolt-DevSuite-arm64.apk | tee signed/signature.txt
          grep -Fx "Signer #1 certificate SHA-256 digest: b2e85ad16066e3fb82e7ab68796b8a3f883510b37e51ae40f10cc3eb2d95bd43" signed/signature.txt || { echo "Unexpected signing certificate; refusing publication"; exit 1; }
          (cd signed && sha256sum AetherBolt-DevSuite-arm64.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: AetherBolt-DevSuite-signed-arm64
          path: signed/
          if-no-files-found: error
