name: Build Gecko Edition alpha
on: [workflow_dispatch, push]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SIGNING_READY: ${{ secrets.AETHER_KEYSTORE_B64 != '' && secrets.AETHER_KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK packages
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --list --channel=3 > /tmp/sdk-packages.txt
          grep -E "platforms;android-(37|CinnamonBun)|build-tools;37" /tmp/sdk-packages.txt || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --channel=3 "platforms;android-37.2" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - run: bash tests/run.sh
      - run: python3 -m unittest discover -s tools -p test_delta.py -v
      - name: Build debug APK (retry transient dependency failures)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if gradle :app:assembleDebug --stacktrace > build-attempt.log 2>&1; then cat build-attempt.log; exit 0; fi
            cat build-attempt.log
            if ! grep -Eq '429|502|503|504|Connection reset|Read timed out' build-attempt.log || [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((attempt * 25))
          done
      - uses: actions/upload-artifact@v4
        with:
          name: AetherBolt-gecko-alpha-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build unsigned ARM64 release
        if: github.ref == 'refs/heads/gecko-edition' && env.SIGNING_READY == 'true'
        run: gradle :app:assembleRelease -PaetherAbi=arm64-v8a --stacktrace
      - name: Sign and verify ARM64 APK
        if: github.ref == 'refs/heads/gecko-edition' && env.SIGNING_READY == 'true'
        shell: bash
        env:
          AETHER_KEYSTORE_B64: ${{ secrets.AETHER_KEYSTORE_B64 }}
          AETHER_KEYSTORE_PASSWORD: ${{ secrets.AETHER_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KEY="$(mktemp "$RUNNER_TEMP/aether-key.XXXXXX")"
          trap 'rm -f "$KEY"' EXIT
          printf '%s' "$AETHER_KEYSTORE_B64" | base64 --decode > "$KEY"
          unset AETHER_KEYSTORE_B64
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          INPUT=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$INPUT"
          mkdir -p signed
          "$TOOLS/zipalign" -P 16 -f 4 "$INPUT" "$RUNNER_TEMP/aligned.apk"
          "$TOOLS/apksigner" sign --ks "$KEY" --ks-type PKCS12 --ks-key-alias aetherbolt --ks-pass env:AETHER_KEYSTORE_PASSWORD --key-pass env:AETHER_KEYSTORE_PASSWORD --out signed/AetherBolt-arm64.apk "$RUNNER_TEMP/aligned.apk"
          "$TOOLS/apksigner" verify --verbose --print-certs signed/AetherBolt-arm64.apk | tee signed/signature.txt
          (cd signed && sha256sum AetherBolt-arm64.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/gecko-edition' && env.SIGNING_READY == 'true'
        with:
          name: AetherBolt-gecko-signed-arm64
          path: signed/
          if-no-files-found: error
